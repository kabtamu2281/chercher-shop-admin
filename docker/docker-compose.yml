version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://kpax_admin:kpax_secure_vps_pass@postgres:5432/kpax_shop
      - PORT=3000
      - TIMEZONE=Africa/Addis_Ababa
      - DEFAULT_CURRENCY=ETB
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: kpax_admin
      POSTGRES_PASSWORD: kpax_secure_vps_pass
      POSTGRES_DB: kpax_shop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpax_admin -d kpax_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
