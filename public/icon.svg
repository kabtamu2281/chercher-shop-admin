<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Architectural Shop & Warehouse Icon -->
  <path d="M256 96 L416 192 L96 192 Z" fill="url(#gold)" />
  <rect x="128" y="208" width="256" height="192" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="8" />
  
  <!-- Pillars / Building Beams -->
  <rect x="160" y="240" width="32" height="136" rx="6" fill="#94a3b8" />
  <rect x="240" y="240" width="32" height="136" rx="6" fill="#94a3b8" />
  <rect x="320" y="240" width="32" height="136" rx="6" fill="#94a3b8" />
  
  <!-- Ethiopian Flag Mini Accent Ribbon -->
  <rect x="180" y="420" width="50" height="12" fill="#16a34a" rx="2" />
  <rect x="231" y="420" width="50" height="12" fill="#eab308" rx="2" />
  <rect x="282" y="420" width="50" height="12" fill="#dc2626" rx="2" />
